<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docket — Case & Document Tracker</title>
<style>
  :root{
    --brand:#0078D4;
    --brand-hover:#106EBE;
    --brand-pressed:#005A9E;
    --brand-tint:#EFF6FC;
    --text-primary:#201F1E;
    --text-secondary:#605E5C;
    --text-tertiary:#8A8886;
    --bg-page:#FAF9F8;
    --bg-surface:#FFFFFF;
    --border:#EDEBE9;
    --divider:#E1DFDD;
    --success:#107C10;
    --success-tint:#DFF6DD;
    --warning:#986F0B;
    --warning-tint:#FFF4CE;
    --info:#004E8C;
    --info-tint:#DEECF9;
    --danger:#A4262C;
    --danger-tint:#FDE7E9;
    --radius:4px;
    --shadow-2: 0 1.6px 3.6px rgba(0,0,0,0.13), 0 0.3px 0.9px rgba(0,0,0,0.11);
    --shadow-4: 0 3.2px 7.2px rgba(0,0,0,0.13), 0 0.6px 1.8px rgba(0,0,0,0.11);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:var(--bg-page);
    color:var(--text-primary);
    font-family:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,"Roboto","Helvetica Neue",Arial,sans-serif;
    font-size:14px;
    line-height:1.5;
  }

  /* ===== Top app bar ===== */
  .app-bar{
    height:48px;
    background:var(--bg-surface);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:0 16px;
    gap:10px;
  }
  .app-bar .app-icon{
    width:24px; height:24px;
    background:var(--brand);
    border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:13px; font-weight:600;
    flex-shrink:0;
  }
  .app-bar .app-name{
    font-size:15px;
    font-weight:600;
    color:var(--text-primary);
  }
  .app-bar .app-sub{
    font-size:12px;
    color:var(--text-tertiary);
    border-left:1px solid var(--divider);
    padding-left:10px;
    margin-left:2px;
  }

  #app{
    display:flex;
    min-height:calc(100vh - 48px);
  }

  /* ===== Left nav pane ===== */
  .tabs{
    width:280px;
    flex-shrink:0;
    background:var(--bg-surface);
    border-right:1px solid var(--border);
    padding:16px 0;
    overflow-y:auto;
  }
  .tabs-heading{
    font-size:12px;
    font-weight:600;
    color:var(--text-tertiary);
    text-transform:uppercase;
    letter-spacing:0.02em;
    padding:0 20px 10px;
  }
  .tab-list{ display:flex; flex-direction:column; }
  .tab{
    position:relative;
    padding:10px 20px 10px 20px;
    cursor:pointer;
    border-left:3px solid transparent;
  }
  .tab:hover{ background:#F3F2F1; }
  .tab .cname{
    display:block;
    font-weight:600;
    font-size:13.5px;
    color:var(--text-primary);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tab .cnum{
    display:block;
    font-size:12px;
    color:var(--text-secondary);
    margin-top:2px;
  }
  .tab.active{
    background:var(--brand-tint);
    border-left-color:var(--brand);
  }
  .tab.active .cname{ color:var(--brand-pressed); }
  .tab .closed-flag{
    display:inline-block;
    font-size:10px;
    font-weight:600;
    color:var(--success);
    background:var(--success-tint);
    border-radius:3px;
    padding:1px 6px;
    margin-left:8px;
    letter-spacing:0.02em;
  }
  .new-case-btn{
    margin:12px 20px 0;
    width:calc(100% - 40px);
    padding:8px 14px;
    background:var(--bg-surface);
    border:1px solid var(--brand);
    border-radius:var(--radius);
    color:var(--brand);
    cursor:pointer;
    font-size:13.5px;
    font-weight:600;
    text-align:left;
  }
  .new-case-btn:hover{ background:var(--brand-tint); }
  .new-case-btn:active{ background:var(--brand); color:#fff; }

  /* ===== Main: case file ===== */
  .file{
    flex:1;
    padding:28px 40px 60px;
    max-width:900px;
  }
  .empty{
    padding:100px 20px;
    text-align:center;
    color:var(--text-secondary);
  }
  .empty h2{ font-weight:600; margin-bottom:6px; color:var(--text-primary); font-size:20px; }

  .file-card{
    background:var(--bg-surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow-2);
    padding:24px 28px;
  }

  .file-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    border-bottom:1px solid var(--divider);
    padding-bottom:16px;
    margin-bottom:20px;
  }
  .file-title{
    font-size:22px;
    font-weight:600;
    margin:0 0 6px 0;
    border:none;
    background:none;
    color:var(--text-primary);
    width:100%;
    font-family:inherit;
    padding:2px 0;
    border-radius:2px;
  }
  .file-title:focus{ outline:2px solid var(--brand); outline-offset:2px; }
  .file-meta-row{
    display:flex;
    gap:16px;
    font-size:12.5px;
    color:var(--text-secondary);
  }
  .file-meta-row .num{
    color:var(--brand-pressed);
    font-weight:600;
    background:var(--brand-tint);
    padding:1px 8px;
    border-radius:3px;
  }
  .status-pill{
    font-size:11.5px;
    padding:4px 12px;
    border-radius:3px;
    font-weight:600;
    letter-spacing:0.02em;
    white-space:nowrap;
    cursor:pointer;
    border:1px solid transparent;
  }
  .status-open{ background:var(--success-tint); color:var(--success); }
  .status-closed{ background:var(--danger-tint); color:var(--danger); }

  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px 28px;
    margin-bottom:24px;
  }
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--text-secondary);
    margin-bottom:5px;
  }
  .field input, .field textarea, .field select{
    width:100%;
    border:1px solid var(--text-tertiary);
    border-radius:var(--radius);
    background:var(--bg-surface);
    padding:6px 10px;
    font-size:14px;
    color:var(--text-primary);
    font-family:inherit;
  }
  .field textarea{ resize:vertical; min-height:56px; }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none; border-color:var(--brand); box-shadow:0 0 0 1px var(--brand);
  }

  .section-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:8px;
    margin-bottom:12px;
    border-bottom:1px solid var(--divider);
  }
  .section-heading h3{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--text-secondary);
    margin:0;
    font-weight:600;
  }
  .add-doc-btn{
    background:var(--brand);
    border:1px solid var(--brand);
    border-radius:var(--radius);
    padding:6px 14px;
    font-size:13px;
    font-weight:600;
    color:#fff;
    cursor:pointer;
  }
  .add-doc-btn:hover{ background:var(--brand-hover); border-color:var(--brand-hover); }
  .add-doc-btn:active{ background:var(--brand-pressed); border-color:var(--brand-pressed); }

  .doc-row{
    display:grid;
    grid-template-columns: 1fr 140px 130px 140px 32px;
    gap:10px;
    align-items:center;
    padding:8px 6px;
    border-radius:var(--radius);
    border-bottom:1px solid var(--border);
  }
  .doc-row:hover{ background:#FAF9F8; }
  .doc-row input, .doc-row select{
    border:1px solid transparent;
    background:transparent;
    font-size:13.5px;
    color:var(--text-primary);
    padding:4px 6px;
    border-radius:3px;
    font-family:inherit;
  }
  .doc-row input:focus, .doc-row select:focus{
    outline:none; background:#fff; border-color:var(--brand);
  }
  .doc-row .doc-title{ font-weight:500; }
  .doc-status{
    font-size:11.5px;
    font-weight:600;
    border-radius:3px;
    padding:4px 6px;
  }
  .doc-status.Draft{ color:var(--warning); background:var(--warning-tint); }
  .doc-status.Filed{ color:var(--text-secondary); background:#F3F2F1; }
  .doc-status.Signed{ color:var(--success); background:var(--success-tint); }
  .doc-status.Executed{ color:var(--success); background:var(--success-tint); }
  .doc-status.Served{ color:var(--info); background:var(--info-tint); }
  .doc-del{
    background:none; border:none; color:var(--text-tertiary); cursor:pointer; font-size:16px; line-height:1;
    border-radius:3px; padding:4px;
  }
  .doc-del:hover{ color:var(--danger); background:var(--danger-tint); }
  .doc-empty{ color:var(--text-secondary); font-size:13px; padding:16px 4px; }

  .notes-block{ margin-top:24px; }

  .file-footer{
    margin-top:28px;
    padding-top:14px;
    border-top:1px solid var(--divider);
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    color:var(--text-secondary);
  }
  .delete-case{
    background:none; border:none; color:var(--danger); cursor:pointer; font-size:12.5px; font-weight:600; padding:0;
  }
  .delete-case:hover{ text-decoration:underline; }

  .save-flag{
    font-size:12px;
    color:var(--success);
    font-weight:600;
    opacity:0;
    transition:opacity 0.4s;
  }
  .save-flag.show{ opacity:1; }

  @media (max-width: 720px){
    #app{ flex-direction:column; }
    .tabs{ width:auto; border-right:none; border-bottom:1px solid var(--border); }
    .tab{ border-left:none; border-bottom:3px solid transparent; }
    .tab.active{ border-left:none; border-bottom-color:var(--brand); }
    .file{ padding:20px 16px 40px; max-width:none; }
    .field-grid{ grid-template-columns:1fr; }
    .doc-row{ grid-template-columns:1fr; gap:4px; padding:12px 6px; }
  }
</style>
</head>
<body>

<div class="app-bar">
  <div class="app-icon">D</div>
  <div class="app-name">Docket</div>
  <div class="app-sub">Case &amp; Document Tracker</div>
</div>
<div id="app"></div>

<script>
(function(){
  const STORE_KEY = "cases";
  let cases = [];
  let activeId = null;
  let loaded = false;

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function nextCaseNumber(){
    const year = new Date().getFullYear();
    const countThisYear = cases.filter(c => c.number && c.number.startsWith(String(year))).length;
    return `${year}-${String(countThisYear+1).padStart(3,"0")}`;
  }

  async function loadData(){
    try{
      const res = await window.storage.get(STORE_KEY, false);
      cases = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      cases = [];
    }
    loaded = true;
    if(cases.length && !activeId) activeId = cases[0].id;
    render();
  }

  let saveTimer=null;
  async function saveData(flag){
    try{
      await window.storage.set(STORE_KEY, JSON.stringify(cases), false);
      if(flag) flashSaved();
    }catch(e){
      console.error("Save failed", e);
    }
  }
  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>saveData(true), 400);
  }
  function flashSaved(){
    const el = document.getElementById("save-flag");
    if(!el) return;
    el.classList.add("show");
    clearTimeout(flashSaved._t);
    flashSaved._t = setTimeout(()=>el.classList.remove("show"), 1200);
  }

  function newCase(){
    const c = {
      id: uid(),
      title: "Untitled Matter",
      number: nextCaseNumber(),
      client: "",
      opened: new Date().toISOString().slice(0,10),
      status: "Open",
      notes: "",
      docs: []
    };
    cases.unshift(c);
    activeId = c.id;
    scheduleSave();
    render();
    setTimeout(()=>{
      const t = document.querySelector(".file-title");
      if(t){ t.focus(); t.select(); }
    },0);
  }

  function newDoc(caseObj){
    caseObj.docs.push({ id: uid(), title:"", type:"Contract", status:"Draft", due:"" });
    scheduleSave();
    render();
  }

  function deleteCase(id){
    if(!confirm("Delete this case file and its documents? This can't be undone.")) return;
    cases = cases.filter(c=>c.id!==id);
    if(activeId===id) activeId = cases.length ? cases[0].id : null;
    scheduleSave();
    render();
  }

  function deleteDoc(caseObj, docId){
    caseObj.docs = caseObj.docs.filter(d=>d.id!==docId);
    scheduleSave();
    render();
  }

  function el(tag, attrs, ...children){
    const e = document.createElement(tag);
    for(const k in (attrs||{})){
      if(k==="class") e.className = attrs[k];
      else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    children.flat().forEach(c=>{
      if(c==null) return;
      e.appendChild(typeof c==="string" ? document.createTextNode(c) : c);
    });
    return e;
  }

  function renderSidebar(){
    const wrap = el("div",{class:"tabs"});
    wrap.appendChild(el("div",{class:"tabs-heading"},"Case Files"));
    const list = el("div",{class:"tab-list"});
    cases.forEach(c=>{
      const tab = el("div",{
        class: "tab" + (c.id===activeId ? " active" : ""),
        onclick: ()=>{ activeId=c.id; render(); }
      },
        el("span",{class:"cname"}, c.title || "Untitled Matter", c.status==="Closed" ? el("span",{class:"closed-flag"},"CLOSED") : null),
        el("span",{class:"cnum"}, c.number)
      );
      list.appendChild(tab);
    });
    wrap.appendChild(list);
    wrap.appendChild(el("button",{class:"new-case-btn", onclick:newCase}, "+ Open new case"));
    return wrap;
  }

  function renderEmpty(){
    return el("div",{class:"file"},
      el("div",{class:"empty"},
        el("h2",{},"No cases yet"),
        el("p",{}, "Open a new file to start tracking a matter and its documents."),
      )
    );
  }

  function renderDocRow(caseObj, doc){
    const row = el("div",{class:"doc-row"});
    row.appendChild(el("input",{
      class:"doc-title", placeholder:"Document title", value:doc.title,
      oninput:(e)=>{ doc.title=e.target.value; scheduleSave(); }
    }));
    const typeSel = el("select",{
      onchange:(e)=>{ doc.type=e.target.value; scheduleSave(); }
    });
    ["Contract","Pleading","Correspondence","Exhibit","Filing","Other"].forEach(t=>{
      const o = el("option",{value:t}, t);
      if(doc.type===t) o.setAttribute("selected","selected");
      typeSel.appendChild(o);
    });
    row.appendChild(typeSel);

    const statusSel = el("select",{
      class:"doc-status " + doc.status,
      onchange:(e)=>{ doc.status=e.target.value; scheduleSave(); render(); }
    });
    ["Draft","Filed","Served","Signed","Executed"].forEach(s=>{
      const o = el("option",{value:s}, s);
      if(doc.status===s) o.setAttribute("selected","selected");
      statusSel.appendChild(o);
    });
    row.appendChild(statusSel);

    row.appendChild(el("input",{
      type:"date", value:doc.due||"",
      onchange:(e)=>{ doc.due=e.target.value; scheduleSave(); }
    }));
    row.appendChild(el("button",{class:"doc-del", title:"Remove document", onclick:()=>deleteDoc(caseObj, doc.id)}, "×"));
    return row;
  }

  function renderFile(caseObj){
    const wrap = el("div",{class:"file"});
    const card = el("div",{class:"file-card"});

    const header = el("div",{class:"file-header"});
    const left = el("div",{style:"flex:1"});
    left.appendChild(el("input",{
      class:"file-title", value:caseObj.title,
      oninput:(e)=>{ caseObj.title=e.target.value; scheduleSave(); },
      onblur:()=>render()
    }));
    left.appendChild(el("div",{class:"file-meta-row"},
      el("span",{}, el("span",{class:"num"}, caseObj.number)),
      el("span",{}, "Opened " + (caseObj.opened||"—"))
    ));
    header.appendChild(left);

    const statusPill = el("span",{
      class:"status-pill " + (caseObj.status==="Open" ? "status-open" : "status-closed"),
      onclick: ()=>{ caseObj.status = caseObj.status==="Open" ? "Closed" : "Open"; scheduleSave(); render(); }
    }, caseObj.status.toUpperCase());
    header.appendChild(statusPill);
    card.appendChild(header);

    const grid = el("div",{class:"field-grid"});
    grid.appendChild(el("div",{class:"field"},
      el("label",{},"Client"),
      el("input",{value:caseObj.client, oninput:(e)=>{caseObj.client=e.target.value; scheduleSave();}})
    ));
    grid.appendChild(el("div",{class:"field"},
      el("label",{},"Opened"),
      el("input",{type:"date", value:caseObj.opened, onchange:(e)=>{caseObj.opened=e.target.value; scheduleSave(); render();}})
    ));
    card.appendChild(grid);

    const secHead = el("div",{class:"section-heading"},
      el("h3",{}, "Documents"),
      el("button",{class:"add-doc-btn", onclick:()=>newDoc(caseObj)}, "+ Add document")
    );
    card.appendChild(secHead);

    if(caseObj.docs.length===0){
      card.appendChild(el("div",{class:"doc-empty"},"No documents filed for this matter yet."));
    } else {
      caseObj.docs.forEach(d=> card.appendChild(renderDocRow(caseObj, d)));
    }

    const notes = el("div",{class:"notes-block field"},
      el("label",{},"Notes"),
      el("textarea",{
        oninput:(e)=>{ caseObj.notes=e.target.value; scheduleSave(); }
      }, caseObj.notes)
    );
    card.appendChild(notes);

    card.appendChild(el("div",{class:"file-footer"},
      el("button",{class:"delete-case", onclick:()=>deleteCase(caseObj.id)}, "Delete case file"),
      el("span",{id:"save-flag", class:"save-flag"}, "Saved")
    ));

    wrap.appendChild(card);
    return wrap;
  }

  function render(){
    const root = document.getElementById("app");
    root.innerHTML = "";
    root.appendChild(renderSidebar());
    if(!loaded){
      root.appendChild(el("div",{class:"file"}, el("div",{class:"empty"}, "Loading…")));
      return;
    }
    const active = cases.find(c=>c.id===activeId);
    if(!active){
      root.appendChild(renderEmpty());
    } else {
      root.appendChild(renderFile(active));
    }
  }

  loadData();
})();
</script>
</body>
</html>
